name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ios/Wad/Resources/engines.js"
      - ".github/workflows/backend-ci.yml"

# Least privilege: nothing at the workflow level, each job asks for what it uses.
permissions: {}

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      pull-requests: read
    uses: ./.github/workflows/changes.yml
    with:
      patterns: '^(backend/|ios/Wad/Resources/engines\.js$|\.github/workflows/(backend-ci|changes)\.yml$)'

  build-test:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: iOS engines bundle is up to date
        run: |
          npm run build:ios-engines
          git diff --exit-code -- ../ios/Wad/Resources/engines.js
