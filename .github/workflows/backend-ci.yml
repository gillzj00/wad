name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "ios/Wad/Resources/engines.js"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ios/Wad/Resources/engines.js"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: iOS engines bundle is up to date
        run: |
          npm run build:ios-engines
          git diff --exit-code -- ../ios/Wad/Resources/engines.js
