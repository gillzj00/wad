name: Changed paths

# Reusable job: did the pull request touch any path matching `patterns`?
#
# The CI workflows used `on.pull_request.paths` filters. Those cannot be
# combined with required status checks: a workflow that never starts leaves
# its check "expected" forever and blocks the merge. A job that is skipped by
# an `if:` condition instead reports success, so each workflow now runs this
# cheap job on every pull request and gates its real job on the result.
# Pushes to main keep their path filters, since required checks do not apply.

on:
  workflow_call:
    inputs:
      patterns:
        description: Extended regular expression matched against each changed path.
        required: true
        type: string
    outputs:
      changed:
        description: "true when at least one changed path matches, or for non-PR events."
        value: ${{ jobs.changes.outputs.changed }}

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PATTERNS: ${{ inputs.patterns }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -Eq "$PATTERNS"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
