name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

jobs:
  build-test:
    # Needs Xcode 16+ (project format 77, Swift 6). macOS minutes count 10x
    # against the private-repo Actions quota, so this only runs for ios/ changes.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Build and test
        run: ios/scripts/test.sh -quiet
