name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

# A new push to the same branch cancels the run in progress; runs on main are
# left to finish.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Needs Xcode 16+ (project format 77, Swift 6). The unit tests and the UI
  # tests are separate jobs so that a change is checked in the time the slower
  # one takes, not the sum. Both pick the simulator with ios/scripts/test.sh.
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Build and run the unit tests
        # xcodebuild has been seen not to exit after the tests when it writes a
        # result bundle, so the step has its own limit.
        timeout-minutes: 15
        run: ios/scripts/test.sh --unit -resultBundlePath "$RUNNER_TEMP/Wad-unit-tests.xcresult"

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Wad-unit-tests.xcresult
          path: ${{ runner.temp }}/Wad-unit-tests.xcresult
          retention-days: 7

  ui-tests:
    runs-on: macos-15
    # The UI tests take a few minutes each on the runner; the script spreads
    # them over simulator clones (see WAD_UI_TEST_WORKERS in test.sh).
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 3]
    env:
      WAD_UI_TEST_WORKERS: ${{ matrix.workers }}
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Build and run the UI tests
        timeout-minutes: 55
        run: ios/scripts/test.sh --ui -resultBundlePath "$RUNNER_TEMP/Wad-ui-tests.xcresult"

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Wad-ui-tests.xcresult
          path: ${{ runner.temp }}/Wad-ui-tests.xcresult
          retention-days: 7
