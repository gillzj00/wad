name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

jobs:
  build-test:
    # Needs Xcode 16+ (project format 77, Swift 6). macOS minutes count 10x
    # against the private-repo Actions quota, so this only runs for ios/ changes.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Build and test
        # xcodebuild has been seen not to exit after the tests when it writes a
        # result bundle, so the step has its own limit.
        timeout-minutes: 20
        run: ios/scripts/test.sh -resultBundlePath "$RUNNER_TEMP/Wad.xcresult"

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Wad.xcresult
          path: ${{ runner.temp }}/Wad.xcresult
          retention-days: 7
