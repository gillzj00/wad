# XcodeGen spec. Regenerate the project after editing: `xcodegen` (from ios/).
# The generated Wad.xcodeproj is committed so XcodeGen is not needed to build.
name: Wad
options:
  bundleIdPrefix: com.gillzj00
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Wad:
    type: application
    platform: iOS
    sources:
      - Wad
    # Only what the INFOPLIST_KEY_ build settings cannot say: the launch
    # screen's background color, the status bar (light on the dark surfaces
    # of both appearances), the location usage string and the courses
    # API settings, which come from the git-ignored Config/Local.xcconfig and
    # are empty without it (the app then says lookup is not configured).
    # The rest of the Info.plist is generated.
    info:
      path: Wad/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Charcoal
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        NSLocationWhenInUseUsageDescription: Your location suggests the courses on this phone near you when you look for a course or set up a round. It stays on the phone.
        WAD_API_BASE_URL: $(WAD_API_BASE_URL)
        WAD_API_CLIENT_TOKEN: $(WAD_API_CLIENT_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gillzj00.wad
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  WadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WadTests
    dependencies:
      - target: Wad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  WadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WadUITests
    dependencies:
      - target: Wad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Wad
schemes:
  Wad:
    build:
      targets:
        Wad: all
        WadTests: [test]
        WadUITests: [test]
    test:
      targets:
        - WadTests
        - WadUITests
